name: Bossa Build CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-qt6-base
          mingw-w64-x86_64-qt6-declarative
          mingw-w64-x86_64-qt6-tools
          mingw-w64-x86_64-qt6-multimedia
          mingw-w64-x86_64-qt6-charts
          mingw-w64-x86_64-qt6-websockets
          mingw-w64-x86_64-qt6-5compat
          mingw-w64-x86_64-qt6-imageformats
          mingw-w64-x86_64-qt6-svg
          mingw-w64-x86_64-mlt
          mingw-w64-x86_64-fftw
          mingw-w64-x86_64-ffmpeg
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-pkg-config

    - name: Configure and Build
      shell: msys2 {0}
      run: |
        mkdir build
        cd build
        cmake ../ -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DSHOTCUT_VERSION="1.0.${{ github.run_number }}"
        ninja

    - name: Deploy and Bundle DLLs
      shell: msys2 {0}
      run: |
        cd build/src
        
        # 1. Copy our internal library (CuteLogger)
        cp ../CuteLogger/libCuteLogger.dll . || cp ../CuteLogger/CuteLogger.dll . || echo "CuteLogger DLL not found"
        
        # 2. Run windeployqt (ignoring errors, we will fix-up with ldd)
        windeployqt6 --no-compiler-runtime --no-translations --qmldir ../../src/qml bossa.exe || true
        
        # 3. Create qt.conf to force look in local directories
        echo "[Paths]" > qt.conf
        echo "Prefix = ." >> qt.conf
        echo "Plugins = ." >> qt.conf
        echo "Imports = ." >> qt.conf
        echo "Qml2Imports = ." >> qt.conf

        # 4. Deep Automated MinGW DLL collection
        # We find EVERY .dll and .exe in the bundle and check their dependencies
        echo "Starting deep-scan DLL collection..."
        for i in {1..4}; do
          find . -name "*.exe" -o -name "*.dll" | xargs ldd 2>/dev/null | grep /mingw64/bin | awk '{print $3}' | xargs -I {} cp -n {} . || true
        done
        
        # 5. Hard-copy all files (convert symlinks to real files)
        find . -type l -exec cp --remove-destination "$(readlink -f {})" {} \; || true

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Bossa-Video-Editor-v1.0.${{ github.run_number }}-Windows
        path: build/src/
