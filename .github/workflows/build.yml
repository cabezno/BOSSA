name: Bossa Build CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-qt6-base
          mingw-w64-x86_64-qt6-declarative
          mingw-w64-x86_64-qt6-tools
          mingw-w64-x86_64-qt6-multimedia
          mingw-w64-x86_64-qt6-charts
          mingw-w64-x86_64-qt6-websockets
          mingw-w64-x86_64-qt6-5compat
          mingw-w64-x86_64-qt6-imageformats
          mingw-w64-x86_64-qt6-svg
          mingw-w64-x86_64-mlt
          mingw-w64-x86_64-fftw
          mingw-w64-x86_64-ffmpeg
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-pkg-config

    - name: Configure and Build
      shell: msys2 {0}
      run: |
        mkdir build
        cd build
        cmake ../ -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DBOSSA_VERSION="1.0.${{ github.run_number }}"
        ninja

    - name: Deploy and Bundle DLLs
      shell: msys2 {0}
      run: |
        # Create the exact directory structure expected by main.cpp (Rebranded)
        DEST="build/src"
        mkdir -p $DEST/lib/qt6
        mkdir -p $DEST/lib/qml
        mkdir -p $DEST/lib/mlt-7
        mkdir -p $DEST/share/bossa/qml
        
        cd $DEST
        
        # 1. Copy our internal library
        cp ../CuteLogger/libCuteLogger.dll . || cp ../CuteLogger/CuteLogger.dll . || true
        
        # 2. Manually copy Qt Plugins to lib/qt6
        echo "Copying Qt plugins..."
        QT_PLUGINS="/mingw64/share/qt6/plugins"
        for plugin in platforms styles imageformats multimedia iconengines tls networkinformation; do
          if [ -d "$QT_PLUGINS/$plugin" ]; then
            cp -r "$QT_PLUGINS/$plugin" lib/qt6/
          fi
        done
        
        # 3. Manually copy ALL QML modules from the system
        echo "Copying QML modules..."
        QT_QML="/mingw64/share/qt6/qml"
        cp -r $QT_QML/* lib/qml/ || true

        # 4. Copy MLT plugins (Critical for video engine)
        echo "Copying MLT plugins..."
        cp -r /mingw64/lib/mlt-7/* lib/mlt-7/ || true

        # 5. Copy application QML files to the correct rebranded path
        echo "Copying application QML..."
        cp -r ../../src/qml/* share/bossa/qml/ || true

        # 6. Create a precise qt.conf
        echo "[Paths]" > qt.conf
        echo "Prefix = ." >> qt.conf
        echo "Plugins = lib/qt6" >> qt.conf
        echo "Imports = lib/qml" >> qt.conf
        echo "Qml2Imports = lib/qml" >> qt.conf

        # 7. Ultimate Recursive DLL Collection (The "God Mode" scan)
        echo "Starting ultimate-scan recursive DLL collection..."
        for i in {1..6}; do
          find . -type f -name "*.exe" -o -name "*.dll" -o -name "*.mjs" | xargs ldd 2>/dev/null | grep /mingw64/bin | awk '{print $3}' | xargs -I {} cp -n {} . || true
        done
        
        # 8. Final Cleanup and Symlink resolution
        find . -type l -exec cp --remove-destination "$(readlink -f {})" {} \; || true
        
        echo "Deployment structure complete."

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Bossa-Video-Editor-v1.0.${{ github.run_number }}-Windows
        path: build/src/
