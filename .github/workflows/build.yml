name: Bossa Build CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-qt6-base
          mingw-w64-x86_64-qt6-multimedia
          mingw-w64-x86_64-qt6-charts
          mingw-w64-x86_64-qt6-websockets
          mingw-w64-x86_64-qt6-5compat
          mingw-w64-x86_64-qt6-imageformats
          mingw-w64-x86_64-mlt7
          mingw-w64-x86_64-fftw3
          mingw-w64-x86_64-ffmpeg
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-pkg-config

    - name: Configure and Build
      shell: msys2 {0}
      run: |
        mkdir build
        cd build
        cmake ../ -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DSHOTCUT_VERSION="1.0.${{ github.run_number }}"
        ninja

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Bossa-Video-Editor-v1.0.${{ github.run_number }}-Windows
        path: build/shotcut.exe
