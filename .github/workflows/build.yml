name: Bossa Build CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.3'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        modules: 'qtmultimedia qtcharts qtwebsockets qt5compat qtimageformats'

    - name: Install Dependencies
      run: |
        choco install ffmpeg pkgconfiglite
        # MLT and other dependencies would normally be handled here
        # For this specific project, we ensure PkgConfig and FFTW are available
        # if the environment allows.

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake ../ -DCMAKE_BUILD_TYPE=Release -DSHOTCUT_VERSION="1.0.${{ github.run_number }}"

    - name: Build Bossa
      run: |
        cd build
        cmake --build . --config Release --parallel 4

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Bossa-Video-Editor-v1.0.${{ github.run_number }}-Windows
        path: build/Release/shotcut.exe
