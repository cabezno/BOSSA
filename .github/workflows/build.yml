name: Bossa Build CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-qt6-base
          mingw-w64-x86_64-qt6-declarative
          mingw-w64-x86_64-qt6-tools
          mingw-w64-x86_64-qt6-multimedia
          mingw-w64-x86_64-qt6-charts
          mingw-w64-x86_64-qt6-websockets
          mingw-w64-x86_64-qt6-5compat
          mingw-w64-x86_64-qt6-imageformats
          mingw-w64-x86_64-qt6-svg
          mingw-w64-x86_64-mlt
          mingw-w64-x86_64-fftw
          mingw-w64-x86_64-ffmpeg
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-pkg-config

    - name: Configure and Build
      shell: msys2 {0}
      run: |
        mkdir build
        cd build
        cmake ../ -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DSHOTCUT_VERSION="1.0.${{ github.run_number }}"
        ninja

    - name: Deploy and Bundle DLLs
      shell: msys2 {0}
      run: |
        # Create the exact directory structure expected by main.cpp
        DEST="build/src"
        mkdir -p $DEST/lib/qt6
        mkdir -p $DEST/lib/qml
        mkdir -p $DEST/share/shotcut/qml
        
        cd $DEST
        
        # 1. Copy our internal library
        cp ../CuteLogger/libCuteLogger.dll . || cp ../CuteLogger/CuteLogger.dll . || true
        
        # 2. Manually copy Qt Plugins to lib/qt6 (as main.cpp expects)
        echo "Copying Qt plugins..."
        QT_PLUGINS="/mingw64/share/qt6/plugins"
        for plugin in platforms styles imageformats multimedia iconengines tls; do
          cp -r "$QT_PLUGINS/$plugin" lib/qt6/
        done
        
        # 3. Manually copy Qt QML modules
        echo "Copying QML modules..."
        QT_QML="/mingw64/share/qt6/qml"
        cp -r $QT_QML/{Qt,QtCore,QtQml,QtQuick,QtQuick.2} lib/qml/ || true

        # 4. Copy application QML files
        echo "Copying application QML..."
        cp -r ../../src/qml/* share/shotcut/qml/ || true

        # 5. Create a precise qt.conf
        echo "[Paths]" > qt.conf
        echo "Prefix = ." >> qt.conf
        echo "Plugins = lib/qt6" >> qt.conf
        echo "Imports = lib/qml" >> qt.conf
        echo "Qml2Imports = lib/qml" >> qt.conf

        # 6. Deep Recursive DLL Collection (The "Whack-a-mole" Killer)
        # This scans EVERY .exe and .dll in the entire structure (including lib/qt6/platforms/)
        # and brings their dependencies to the root.
        echo "Starting deep-scan recursive DLL collection..."
        for i in {1..4}; do
          find . -name "*.exe" -o -name "*.dll" | xargs ldd 2>/dev/null | grep /mingw64/bin | awk '{print $3}' | xargs -I {} cp -n {} . || true
        done
        
        # 7. Final Sanity Check: Ensure qwindows.dll has no missing deps in its own folder
        # Sometimes plugins need their deps right next to them or in the root. Root is usually fine with SetDllDirectory.
        
        # 8. Clean up symlinks
        find . -type l -exec cp --remove-destination "$(readlink -f {})" {} \; || true

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Bossa-Video-Editor-v1.0.${{ github.run_number }}-Windows
        path: build/src/
